<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TetherLabs LinkedIn Banner</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #f0f0f0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px;
        }

        .instructions {
            margin-bottom: 20px;
            text-align: center;
            color: #374151;
        }

        .instructions h2 {
            margin-bottom: 8px;
        }

        .instructions p {
            font-size: 14px;
            color: #6b7280;
        }

        /* LinkedIn Banner - 1584 x 396 pixels */
        .banner {
            width: 1584px;
            height: 396px;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            border-radius: 8px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
        }

        /* Subtle gradient accent */
        .banner::before {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            width: 60%;
            height: 100%;
            background: radial-gradient(ellipse at 80% 50%, rgba(8, 145, 178, 0.15) 0%, transparent 60%);
            pointer-events: none;
        }

        /* Geometric accent lines */
        .accent-lines {
            position: absolute;
            right: 200px;
            top: 50%;
            transform: translateY(-50%);
            width: 300px;
            height: 300px;
            opacity: 0.1;
        }

        .accent-lines::before,
        .accent-lines::after {
            content: '';
            position: absolute;
            border: 2px solid #0891b2;
            border-radius: 50%;
        }

        .accent-lines::before {
            width: 200px;
            height: 200px;
            top: 50px;
            left: 50px;
        }

        .accent-lines::after {
            width: 280px;
            height: 280px;
            top: 10px;
            left: 10px;
        }

        /* Content */
        .banner-content {
            padding-left: 80px;
            position: relative;
            z-index: 2;
            max-width: 900px;
        }

        .tagline {
            display: inline-block;
            background: linear-gradient(135deg, #0891b2 0%, #06b6d4 100%);
            color: #ffffff;
            font-size: 14px;
            font-weight: 600;
            padding: 8px 16px;
            border-radius: 20px;
            margin-bottom: 24px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .headline {
            font-size: 64px;
            font-weight: 800;
            color: #ffffff;
            line-height: 1.1;
            margin-bottom: 20px;
            letter-spacing: -0.02em;
        }

        .headline span {
            background: linear-gradient(135deg, #0891b2 0%, #22d3ee 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subheadline {
            font-size: 22px;
            color: #94a3b8;
            font-weight: 500;
            letter-spacing: 0.02em;
        }

        /* Logo area */
        .logo-area {
            position: absolute;
            right: 80px;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            z-index: 2;
        }

        .logo-icon {
            width: 80px;
            height: 80px;
            background: #ffffff;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .logo-icon img {
            width: 60px;
            height: 60px;
            object-fit: contain;
        }

        .logo-text {
            font-size: 24px;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: -0.02em;
        }

        .website {
            font-size: 14px;
            color: #0891b2;
            font-weight: 500;
        }

        /* Decorative elements */
        .dot-pattern {
            position: absolute;
            right: 300px;
            bottom: 40px;
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 12px;
            opacity: 0.2;
        }

        .dot {
            width: 6px;
            height: 6px;
            background: #0891b2;
            border-radius: 50%;
        }

        /* Bottom accent bar */
        .bottom-accent {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, #0891b2 0%, #06b6d4 50%, #0891b2 100%);
        }
    </style>
</head>
<body>
    <div class="instructions">
        <h2>LinkedIn Banner Preview</h2>
        <p>Right-click the banner below and select "Save image as..." or take a screenshot at 1584×396 pixels</p>
    </div>

    <div class="banner">
        <!-- Decorative elements -->
        <div class="accent-lines"></div>
        <div class="dot-pattern">
            <div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div>
            <div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div>
            <div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div>
        </div>

        <!-- Main content -->
        <div class="banner-content">
            <div class="tagline">B2B SaaS Growth</div>
            <h1 class="headline">Creator-Led <span>Pipeline</span><br>Generation</h1>
            <p class="subheadline">LinkedIn Creator Marketing → Qualified Meetings</p>
        </div>

        <!-- Logo -->
        <div class="logo-area">
            <div class="logo-icon">
                <img src="Cursor Logo 80-90.png" alt="TetherLabs">
            </div>
            <div class="logo-text">TetherLabs</div>
            <div class="website">tetherlabs.net</div>
        </div>

        <!-- Bottom accent -->
        <div class="bottom-accent"></div>
    </div>
</body>
</html>
