<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TetherLabs LinkedIn Banner</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #f0f0f0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px;
        }

        .instructions {
            margin-bottom: 20px;
            text-align: center;
            color: #374151;
        }

        .instructions h2 {
            margin-bottom: 8px;
        }

        .instructions p {
            font-size: 14px;
            color: #6b7280;
        }

        .instructions .note {
            margin-top: 8px;
            font-size: 12px;
            color: #9ca3af;
        }

        /* LinkedIn Banner - 1584 x 396 pixels */
        .banner {
            width: 1584px;
            height: 396px;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 40%, #0f172a 100%);
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            border-radius: 8px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
        }

        /* Profile photo safe zone indicator (for reference - comment out for final) */
        .safe-zone {
            position: absolute;
            left: 0;
            top: 0;
            width: 500px;
            height: 100%;
            /* Uncomment to see the safe zone */
            /* background: rgba(255, 0, 0, 0.1); */
            /* border-right: 2px dashed rgba(255, 0, 0, 0.3); */
            pointer-events: none;
            z-index: 10;
        }

        /* Subtle gradient accent on right side */
        .banner::before {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            width: 50%;
            height: 100%;
            background: radial-gradient(ellipse at 90% 50%, rgba(8, 145, 178, 0.12) 0%, transparent 60%);
            pointer-events: none;
        }

        /* Geometric accent - subtle circles */
        .accent-circles {
            position: absolute;
            right: 100px;
            top: 50%;
            transform: translateY(-50%);
            width: 350px;
            height: 350px;
            opacity: 0.08;
            pointer-events: none;
        }

        .accent-circles::before,
        .accent-circles::after {
            content: '';
            position: absolute;
            border: 2px solid #0891b2;
            border-radius: 50%;
        }

        .accent-circles::before {
            width: 200px;
            height: 200px;
            top: 75px;
            left: 75px;
        }

        .accent-circles::after {
            width: 320px;
            height: 320px;
            top: 15px;
            left: 15px;
        }

        /* Main content - starts after 500px safe zone */
        .banner-content {
            position: absolute;
            left: 540px; /* Starting after 500px safe zone + some padding */
            top: 50%;
            transform: translateY(-50%);
            z-index: 2;
            max-width: 700px;
        }

        .headline {
            font-size: 58px;
            font-weight: 800;
            color: #ffffff;
            line-height: 1.1;
            margin-bottom: 16px;
            letter-spacing: -0.03em;
        }

        .headline span {
            background: linear-gradient(135deg, #0891b2 0%, #22d3ee 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subheadline {
            font-size: 24px;
            color: #e2e8f0;
            font-weight: 500;
            letter-spacing: 0.01em;
        }

        .subheadline .arrow {
            color: #0891b2;
            margin: 0 8px;
        }

        /* Logo area - right side, more prominent */
        .logo-area {
            position: absolute;
            right: 70px;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            align-items: center;
            gap: 20px;
            z-index: 2;
        }

        /* Bird icon - larger, no white box */
        .logo-icon {
            width: 100px;
            height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
            filter: brightness(0) invert(1); /* Makes the logo white */
        }

        .logo-icon img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .logo-text {
            font-size: 36px;
            font-weight: 800;
            color: #ffffff;
            letter-spacing: -0.02em;
        }

        /* Tagline pill - moved to right side near logo */
        .tagline {
            position: absolute;
            right: 70px;
            top: 50px;
            display: inline-block;
            background: linear-gradient(135deg, #0891b2 0%, #06b6d4 100%);
            color: #ffffff;
            font-size: 12px;
            font-weight: 700;
            padding: 8px 16px;
            border-radius: 20px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            z-index: 2;
        }

        /* Bottom accent bar */
        .bottom-accent {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, transparent 0%, #0891b2 30%, #06b6d4 70%, transparent 100%);
        }

        /* Dot pattern decoration */
        .dot-pattern {
            position: absolute;
            left: 520px;
            bottom: 50px;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            opacity: 0.15;
        }

        .dot {
            width: 5px;
            height: 5px;
            background: #0891b2;
            border-radius: 50%;
        }
    </style>
</head>
<body>
    <div class="instructions">
        <h2>LinkedIn Banner Preview (1584 × 396)</h2>
        <p>Screenshot this banner or right-click → "Open image in new tab" → Save</p>
        <p class="note">Left 500px is kept clear for profile photo overlay on desktop</p>
    </div>

    <div class="banner">
        <!-- Safe zone indicator (hidden by default) -->
        <div class="safe-zone"></div>

        <!-- Decorative elements -->
        <div class="accent-circles"></div>
        <div class="dot-pattern">
            <div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div>
            <div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div>
            <div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div>
        </div>

        <!-- Tagline pill - top right -->
        <div class="tagline">B2B SaaS Growth</div>

        <!-- Main content - positioned after safe zone -->
        <div class="banner-content">
            <h1 class="headline">Creator-Led <span>Pipeline</span><br>Generation</h1>
            <p class="subheadline">LinkedIn Creator Marketing <span class="arrow">→</span> Qualified Meetings</p>
        </div>

        <!-- Logo - right side, prominent -->
        <div class="logo-area">
            <div class="logo-icon">
                <img src="Cursor Logo 80-90.png" alt="TetherLabs">
            </div>
            <div class="logo-text">TetherLabs</div>
        </div>

        <!-- Bottom accent -->
        <div class="bottom-accent"></div>
    </div>
</body>
</html>
