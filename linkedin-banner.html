<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TetherLabs LinkedIn Banner</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #f0f0f0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px;
        }

        .instructions {
            margin-bottom: 20px;
            text-align: center;
            color: #374151;
        }

        .instructions h2 {
            margin-bottom: 8px;
        }

        .instructions p {
            font-size: 14px;
            color: #6b7280;
        }

        /* LinkedIn Banner - 1584 x 396 pixels */
        .banner {
            width: 1584px;
            height: 396px;
            background: linear-gradient(135deg, #0a0f1a 0%, #111827 50%, #0a0f1a 100%);
            position: relative;
            overflow: hidden;
            border-radius: 8px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
        }

        /* Subtle blue gradient glow on right side */
        .banner::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -10%;
            width: 60%;
            height: 200%;
            background: radial-gradient(ellipse at center, rgba(8, 145, 178, 0.15) 0%, rgba(8, 145, 178, 0.05) 30%, transparent 60%);
            pointer-events: none;
        }

        /* Left third gradient fade for profile photo area */
        .banner::after {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            width: 528px;
            height: 100%;
            background: linear-gradient(90deg, rgba(10, 15, 26, 0.95) 0%, rgba(10, 15, 26, 0.7) 60%, transparent 100%);
            pointer-events: none;
        }

        /* Logo area - top right corner */
        .logo-area {
            position: absolute;
            right: 130px;
            top: 40px;
            display: flex;
            align-items: center;
            gap: 12px;
            z-index: 2;
        }

        .logo-icon {
            width: 72px;
            height: 72px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .logo-icon img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            filter: brightness(0) invert(1);
        }

        .logo-text {
            font-size: 28px;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: -0.02em;
        }

        /* Main content - centre-right area */
        .banner-content {
            position: absolute;
            left: 580px;
            top: 50%;
            transform: translateY(-50%);
            z-index: 2;
            display: flex;
            flex-direction: column;
            gap: 0;
        }

        /* Blue accent line */
        .accent-line {
            width: 50px;
            height: 4px;
            background: linear-gradient(90deg, #0891b2, #22d3ee);
            border-radius: 2px;
            margin-bottom: 20px;
        }

        /* Main headline */
        .headline {
            font-size: 62px;
            font-weight: 800;
            color: #ffffff;
            line-height: 1.1;
            margin-bottom: 16px;
            letter-spacing: -0.03em;
        }

        .headline .blue {
            color: #22d3ee;
        }

        /* Subheadline */
        .subheadline {
            font-size: 23px;
            color: rgba(255, 255, 255, 0.9);
            font-weight: 400;
            line-height: 1.5;
            max-width: 780px;
            margin-bottom: 20px;
        }

        /* Divider line */
        .divider {
            width: 100%;
            max-width: 500px;
            height: 1px;
            background: rgba(255, 255, 255, 0.15);
            margin-bottom: 20px;
        }

        /* CTA */
        .cta {
            position: absolute;
            right: 60px;
            bottom: 40px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 19px;
            color: rgba(255, 255, 255, 0.5);
            font-weight: 500;
            z-index: 2;
        }

        .cta-icon {
            width: 18px;
            height: 18px;
            fill: rgba(255, 255, 255, 0.5);
        }

        .cta .arrow {
            color: rgba(255, 255, 255, 0.4);
            margin: 0 4px;
        }

        .cta .url {
            color: #22d3ee;
            font-weight: 600;
        }

        .highlight {
            color: #22d3ee;
        }
    </style>
</head>
<body>
    <div class="instructions">
        <h2>LinkedIn Banner Preview (1584 × 396)</h2>
        <p>Screenshot this banner or use Puppeteer to capture as PNG</p>
    </div>

    <div class="banner">
        <!-- Logo - top right corner -->
        <div class="logo-area">
            <div class="logo-icon">
                <img src="Cursor Logo 80-90.png" alt="TetherLabs Logo">
            </div>
            <div class="logo-text">TetherLabs</div>
        </div>

        <!-- Main content -->
        <div class="banner-content">
            <div class="accent-line"></div>
            <h1 class="headline">Creator-Led <span class="blue">Pipeline</span> Generation</h1>
            <p class="subheadline">B2B Tech & SaaS companies generating warm pipeline through creators their buyers already trust</p>
        </div>

        <!-- CTA - positioned independently at bottom right -->
        <div class="cta">
            🔗 Learn how it works <span class="arrow">→</span> <span class="url">www.tetherlabs.net</span>
        </div>
    </div>
</body>
</html>
