<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TetherLabs LinkedIn Banner</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #f0f0f0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px;
        }

        .instructions {
            margin-bottom: 20px;
            text-align: center;
            color: #374151;
        }

        .instructions h2 {
            margin-bottom: 8px;
        }

        .instructions p {
            font-size: 14px;
            color: #6b7280;
        }

        .instructions .note {
            margin-top: 8px;
            font-size: 12px;
            color: #9ca3af;
        }

        /* LinkedIn Banner - 1584 x 396 pixels */
        .banner {
            width: 1584px;
            height: 396px;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 40%, #0f172a 100%);
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            border-radius: 8px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
        }

        /* Subtle gradient accent on right side */
        .banner::before {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            width: 40%;
            height: 100%;
            background: radial-gradient(ellipse at 85% 60%, rgba(8, 145, 178, 0.1) 0%, transparent 55%);
            pointer-events: none;
        }

        /* Geometric accent - subtle circles */
        .accent-circles {
            position: absolute;
            right: 50px;
            top: 50%;
            transform: translateY(-50%);
            width: 300px;
            height: 300px;
            opacity: 0.06;
            pointer-events: none;
        }

        .accent-circles::before,
        .accent-circles::after {
            content: '';
            position: absolute;
            border: 2px solid #0891b2;
            border-radius: 50%;
        }

        .accent-circles::before {
            width: 180px;
            height: 180px;
            top: 60px;
            left: 60px;
        }

        .accent-circles::after {
            width: 280px;
            height: 280px;
            top: 10px;
            left: 10px;
        }

        /* Main content - starts after 500px safe zone */
        .banner-content {
            position: absolute;
            left: 540px;
            top: 50%;
            transform: translateY(-50%);
            z-index: 2;
        }

        /* Single line headline - reduced size */
        .headline {
            font-size: 46px;
            font-weight: 800;
            color: #ffffff;
            line-height: 1.15;
            margin-bottom: 14px;
            letter-spacing: -0.03em;
            white-space: nowrap;
        }

        .headline span {
            background: linear-gradient(135deg, #0891b2 0%, #22d3ee 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* Subline - smaller and lighter */
        .subheadline {
            font-size: 18px;
            color: #94a3b8;
            font-weight: 500;
            letter-spacing: 0.01em;
        }

        .subheadline .arrow {
            color: #0891b2;
            margin: 0 6px;
            font-weight: 600;
        }

        /* Vertical divider line */
        .divider {
            position: absolute;
            right: 320px;
            top: 50%;
            transform: translateY(-50%);
            width: 1px;
            height: 120px;
            background: linear-gradient(180deg, transparent 0%, rgba(148, 163, 184, 0.3) 20%, rgba(148, 163, 184, 0.3) 80%, transparent 100%);
            z-index: 2;
        }

        /* Logo area - bottom right corner */
        .logo-area {
            position: absolute;
            right: 70px;
            bottom: 50px;
            display: flex;
            align-items: center;
            gap: 16px;
            z-index: 2;
        }

        /* Bird icon - white on dark */
        .logo-icon {
            width: 70px;
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: center;
            filter: brightness(0) invert(1);
        }

        .logo-icon img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .logo-text {
            font-size: 32px;
            font-weight: 800;
            color: #ffffff;
            letter-spacing: -0.02em;
        }

        /* Bottom accent bar */
        .bottom-accent {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background: linear-gradient(90deg, transparent 0%, #0891b2 35%, #06b6d4 65%, transparent 100%);
        }
    </style>
</head>
<body>
    <div class="instructions">
        <h2>LinkedIn Banner Preview (1584 × 396)</h2>
        <p>Screenshot this banner or right-click → "Open image in new tab" → Save</p>
        <p class="note">Left 500px is kept clear for profile photo overlay on desktop</p>
    </div>

    <div class="banner">
        <!-- Decorative elements -->
        <div class="accent-circles"></div>

        <!-- Main content - positioned after safe zone -->
        <div class="banner-content">
            <h1 class="headline">Creator-Led <span>Pipeline</span> Generation</h1>
            <p class="subheadline">LinkedIn Creator Marketing <span class="arrow">→</span> Qualified Meetings</p>
        </div>

        <!-- Vertical divider -->
        <div class="divider"></div>

        <!-- Logo - bottom right corner -->
        <div class="logo-area">
            <div class="logo-icon">
                <img src="Cursor Logo 80-90.png" alt="TetherLabs">
            </div>
            <div class="logo-text">TetherLabs</div>
        </div>

        <!-- Bottom accent -->
        <div class="bottom-accent"></div>
    </div>
</body>
</html>
